<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5">
  <rect width="720" height="360" rx="8" fill="#0d1117"/>
  <rect x="0" y="0" width="720" height="34" rx="8" fill="#161b22"/>
  <rect x="0" y="26" width="720" height="8" fill="#161b22"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="39" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="17" r="5.5" fill="#28c840"/>
  <text x="360" y="21.5" fill="#6e7681" font-size="11.5" text-anchor="middle">psf/black — one commit, nothing else touched</text>

  <text x="22" y="66" fill="#8b949e">$</text>
  <text x="40" y="66" fill="#e6edf3">whycache .</text>

  <text x="22" y="110" fill="#f85149" font-weight="bold">X</text>
  <text x="40" y="110" fill="#c9d1d9">Cache broke at </text>
  <text x="169" y="110" fill="#e6edf3" font-weight="bold">builder step 3</text>
  <text x="288" y="110" fill="#c9d1d9">:  COPY . /src/</text>

  <text x="40" y="146" fill="#c9d1d9">Reason - 1 file(s) changed in the build context:</text>
  <text x="62" y="176" fill="#f0883e">.git/index</text>

  <text x="40" y="212" fill="#c9d1d9">Cost - </text>
  <text x="101" y="212" fill="#f85149" font-weight="bold">5m14s</text>
  <text x="160" y="212" fill="#c9d1d9">of this 5m14s build.</text>

  <text x="40" y="256" fill="#d29922">.git/ is breaking the cache, but do NOT ignore it:</text>
  <text x="62" y="280" fill="#8b949e">pyproject.toml reads git metadata at build time, so</text>
  <text x="62" y="302" fill="#8b949e">excluding .git/ makes the build fail rather than just slow.</text>
  <text x="62" y="324" fill="#8b949e">Pass the version in as a build arg instead.</text>
</svg>
